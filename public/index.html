<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal</title>
  <style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --sunken: #eef2f6;
  --ink: #0e1a24;
  --muted: #5d6e7c;
  --line: #e1e7ed;
  --accent: #e8021c;
  --accent-soft: #fdeaec;
  --accent-ink: #ffffff;
  --danger: #a61b12;
  --shadow: 0 1px 2px rgba(14, 26, 36, .06), 0 8px 24px -12px rgba(14, 26, 36, .18);
  --r-card: 16px; --r-ctl: 10px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b141b; --surface: #121e27; --sunken: #0e1820; --ink: #e8eff4; --muted: #8fa1ae;
  --line: #213440; --accent: #ff4d5c; --accent-soft: #3a1219; --accent-ink: #2a0408; --danger: #ffa39b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0b141b; --surface: #121e27; --sunken: #0e1820; --ink: #e8eff4; --muted: #8fa1ae;
    --line: #213440; --accent: #ff4d5c; --accent-soft: #3a1219; --accent-ink: #2a0408; --danger: #ffa39b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15.5px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { letter-spacing: -.015em; }

.wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
.wrap.wide { max-width: 1120px; }
header.bar {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: .75rem 0 1.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--line);
}
header.bar h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
header.bar small { color: var(--muted); display: block; margin-top: .1rem; }
.bar-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.theme-fab { position: fixed; top: 1rem; right: 1rem; }

button, .btn {
  font: inherit; font-weight: 500; cursor: pointer; border-radius: var(--r-ctl); padding: .55rem 1rem;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .15s, border-color .15s, color .15s;
}
button:hover { border-color: var(--accent); background: var(--accent-soft); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.danger { color: var(--danger); border-color: transparent; background: transparent; }
button.danger:hover { border-color: var(--danger); background: transparent; }
.icon-btn { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; padding: 0; border-radius: 50%; color: var(--muted); }
.icon-btn:hover { color: var(--accent); }
.icon-btn svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.note { margin: .75rem 0 0; font-size: .9rem; color: var(--muted); max-width: 72ch; }
.empty, .error { color: var(--muted); }
.error { color: var(--danger); }

/* login */
#vLogin { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
.login { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 2rem; box-shadow: var(--shadow); }
.login h1 { margin: 0 0 .35rem; font-size: 1.5rem; }
.login .logo { display: block; width: min(260px, 80%); height: auto; margin: .25rem auto 1.5rem; }
:root[data-theme="dark"] .logo-light, :root:not([data-theme="dark"]) .logo-dark { display: none; }
.login h1, .login > p { text-align: center; }
.login p { margin: 0 0 1.5rem; color: var(--muted); }
.login label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .3rem; }
.login input { width: 100%; font: inherit; padding: .7rem .85rem; margin-bottom: 1rem;
  border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--sunken); color: var(--ink); }
.login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.login button { width: 100%; padding: .75rem 1rem; }
#msg { min-height: 1.5rem; margin: .75rem 0 0; }

/* pencarian */
.search {
  width: 100%; max-width: 420px; font: inherit; padding: .65rem .9rem; margin-bottom: .75rem;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
}
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search[hidden], .note[hidden] { display: none; }

/* kartu layanan: grafik dibingkai seperti layar instrumen */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.1rem; margin-top: 0; }
.card {
  text-align: left; display: flex; flex-direction: column; gap: .75rem; padding: 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); color: var(--ink);
  box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); background: var(--surface); }
.card h2 { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.3; }
.card img, dialog img { display: block; width: 100%; height: auto; border-radius: 8px; background: #fff; border: 1px solid var(--line); }

/* panel info layanan (kanan, di atas kartu pada layar sempit) */
.dash-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.25rem; align-items: start; }
.dash-layout.no-info { grid-template-columns: minmax(0, 1fr); }
.info { position: sticky; top: 5.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 1rem 1.15rem; box-shadow: var(--shadow); }
.info > h2 { margin: 0 0 .75rem; font-size: 1rem; }
.info details { border-top: 1px solid var(--line); padding: .65rem 0; }
.info details:first-of-type { border-top: 0; padding-top: 0; }
.info summary { cursor: pointer; font-weight: 600; font-size: .95rem; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.info summary::-webkit-details-marker { display: none; }
.info summary::after { content: ""; flex: none; width: .45rem; height: .45rem; margin-right: .2rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
.info details[open] summary::after { transform: rotate(-135deg); }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem .9rem; margin: .75rem 0 0; font-size: .9rem; }
.info > dl { margin-top: 0; }
.info dt { color: var(--muted); }
.info dd { margin: 0; overflow-wrap: anywhere; }
.info dd.full { grid-column: 1 / -1; color: var(--muted); }
@media (max-width: 980px) { .dash-layout { grid-template-columns: minmax(0, 1fr); } .info { position: static; order: -1; } }


/* logo di top bar */
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.brand img { height: 30px; width: auto; flex: none; }
.brand h1 { padding-left: 1rem; border-left: 1px solid var(--line); line-height: 1.2; }
@media (max-width: 560px) { #vDash .brand h1 { display: none; } }

/* menu profil */
.profile { position: relative; }
.profile-btn { display: flex; align-items: center; gap: .5rem; padding: .3rem .65rem .3rem .3rem; border-radius: 999px; }
.avatar { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .8rem; letter-spacing: .02em; }
.pname { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.profile-btn svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); transition: transform .15s; }
.profile-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu { position: absolute; right: 0; top: calc(100% + .5rem); min-width: 230px; z-index: 20; display: grid; gap: .15rem; padding: .4rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.menu-head { display: grid; padding: .5rem .65rem .65rem; margin-bottom: .25rem; border-bottom: 1px solid var(--line); }
.menu-head small { color: var(--muted); overflow-wrap: anywhere; }
.menu button { text-align: left; border-color: transparent; background: transparent; border-radius: 8px; padding: .5rem .65rem; }
.menu button:hover, .menu button:focus-visible { background: var(--sunken); border-color: transparent; }
.menu button.danger { color: var(--danger); }
@media (max-width: 520px) { .pname { display: none; } .profile-btn { padding-right: .5rem; } }

/* top bar menempel + toolbar */
header.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: .75rem 1rem; flex-wrap: wrap; margin: 0 0 1rem; }
.toolbar .tabs { margin-bottom: 0; }
.legend { display: flex; gap: 1rem; color: var(--muted); font-size: .9rem; }
.card .chart { min-height: 170px; margin-top: auto; }
.card h2 { overflow-wrap: anywhere; }

/* grafik canvas */
.chart { position: relative; min-height: 140px; }
.chart canvas { display: block; width: 100%; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); touch-action: pan-y; }
.chart .cursor { position: absolute; width: 1px; background: var(--muted); opacity: .6; pointer-events: none; }
.chart .tip { position: absolute; top: 8px; padding: .4rem .6rem; font-size: .8rem; line-height: 1.4; pointer-events: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); white-space: nowrap; }
.dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .35rem; }
.stats { margin-top: 1rem; }

/* dialog */
dialog {
  width: min(800px, 94vw); border: 1px solid var(--line); border-radius: 20px; padding: 1.25rem 1.5rem 1.5rem;
  background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45);
}
dialog[open] { animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } button { transition: none; } }
dialog::backdrop { background: rgba(8, 16, 22, .55); backdrop-filter: blur(3px); }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-bottom: 1rem; }
.dlg-head h2 { margin: 0; font-size: 1.15rem; }
dialog img { min-height: 120px; }
.tabs { display: inline-flex; gap: .25rem; flex-wrap: wrap; margin-bottom: 1rem; padding: .25rem; background: var(--sunken); border-radius: 999px; }
.tabs button { padding: .35rem .95rem; font-size: .88rem; border-color: transparent; background: transparent; border-radius: 999px; color: var(--muted); }
.tabs button:hover { background: transparent; color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); font-weight: 600; }

/* halaman admin */
.admin { display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; align-items: start; }
@media (max-width: 760px) { .admin { grid-template-columns: 1fr; } }
aside .primary { width: 100%; }
.list { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: .35rem; }
.item { width: 100%; text-align: left; display: grid; gap: .1rem; padding: .6rem .85rem; border-color: transparent; background: transparent; }
.item:hover { background: var(--sunken); border-color: transparent; }
.item span { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; font-weight: 400; }
.item[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; box-shadow: inset 3px 0 0 var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 1.25rem 1.5rem 1.5rem; min-height: 220px; box-shadow: var(--shadow); }
.panel h2 { margin: 0; font-size: 1.25rem; }
.panel h3 { margin: 1.75rem 0 .5rem; font-size: 1rem; }
.stack { display: grid; gap: .85rem; }
.stack h2 { margin: 0; }
label { display: grid; gap: .3rem; font-weight: 600; font-size: .88rem; }
label input:not([type="checkbox"]) {
  font: inherit; font-weight: 400; padding: .55rem .75rem; border: 1px solid var(--line);
  border-radius: var(--r-ctl); background: var(--sunken); color: var(--ink); min-width: 0;
}
label input:not([type="checkbox"]):focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
label.check { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
input[type="checkbox"] { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
.inline { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin: 1rem 0; }
.inline label { flex: 1 1 180px; }
.row-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { font-size: .82rem; font-weight: 600; color: var(--muted); background: var(--sunken); }
th, td { text-align: left; padding: .6rem .85rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.act { white-space: nowrap; text-align: right; }
td.act button { padding: .25rem .65rem; font-size: .85rem; }
dialog .search { max-width: none; margin: 0; border-radius: var(--r-ctl); }
dialog .list { max-height: 50vh; overflow-y: auto; }
  </style>
  <script>
// Tema: terang / gelap. Pertama kali ikut pengaturan sistem, lalu pilihan disimpan di localStorage.
(function () {
  var KEY = "theme", root = document.documentElement;
  var modes = ["light", "dark"];
  var names = { light: "Light", dark: "Dark" };
  var icons = {
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    dark: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
  };
  function get() {
    var sys = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    try { var v = localStorage.getItem(KEY); return modes.indexOf(v) > -1 ? v : sys; }
    catch (e) { return sys; }
  }
  function apply(m) {
    root.setAttribute("data-theme", m);
  }
  apply(get()); // dijalankan di <head> agar tidak berkedip

  document.addEventListener("DOMContentLoaded", function () {
    var btns = [];
    function label() {
      var m = get(), n = names[m];
      btns.forEach(function (b) {
        b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[m] + '</svg>';
        b.title = "Theme: " + n;
        b.setAttribute("aria-label", "Change theme, currently " + n.toLowerCase());
      });
    }
    function cycle() {
      var m = modes[(modes.indexOf(get()) + 1) % modes.length];
      try { localStorage.setItem(KEY, m); } catch (e) {}
      apply(m); label();
    }
    // satu tombol di setiap .bar-actions (header dashboard, admin, dan pojok halaman login)
    document.querySelectorAll(".bar-actions").forEach(function (slot) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "icon-btn";
      b.addEventListener("click", cycle);
      slot.prepend(b); btns.push(b);
    });
    window.addEventListener("storage", function () { apply(get()); label(); });
    label();
  });
})();
  </script>
</head>
<body>
<!-- ===== LOGIN ===== -->
<div id="vLogin" hidden>
  <div class="bar-actions theme-fab"></div>
  <main class="login">
    <img class="logo logo-light" src="/logo.png" alt="Merdeka Telekomunikasi Center" width="260" height="66">
    <img class="logo logo-dark" src="/logo-dark.png" alt="" width="260" height="66" aria-hidden="true">
    <h1>Customer Portal</h1>
    <p>Sign in to view the traffic graphs for your services.</p>
    <form id="f">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <p id="msg" class="error" role="alert"></p>
    </form>
  </main>
</div>

<!-- ===== DASHBOARD PELANGGAN ===== -->
<div id="vDash" class="wrap wide" hidden>
  <header class="bar">
    <div class="brand">
      <img class="logo-light" src="/logo.png" alt="Merdeka Telekomunikasi Center" height="30">
      <img class="logo-dark" src="/logo-dark.png" alt="" aria-hidden="true" height="30">
      <h1>My Service Traffic</h1>
    </div>
    <div class="bar-actions">
      <div class="profile">
        <button type="button" class="profile-btn" id="dprof" aria-haspopup="menu" aria-expanded="false" aria-controls="dmenu" aria-label="Account menu">
          <span class="avatar" id="dav" aria-hidden="true">?</span><span class="pname" id="dpname"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="dmenu" role="menu" hidden>
          <div class="menu-head"><strong id="dname"></strong><small id="dwho"></small></div>
          <button type="button" role="menuitem" data-pass>Change password</button>
          <button type="button" role="menuitem" class="danger" id="dlogout">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <input id="dq" class="search" type="search" placeholder="Search services" aria-label="Search services" hidden>
  <div id="toolbar" class="toolbar" hidden>
    <div class="tabs" id="ptabs" role="group" aria-label="Time range"></div>
    <div class="legend"><span><i class="dot" style="background:#22a559"></i>In</span><span><i class="dot" style="background:#3b7ddd"></i>Out</span><span>Click a card for details</span></div>
  </div>
  <div id="dlayout" class="dash-layout no-info">
    <div id="app" class="empty">Loading...</div>
    <aside id="info" class="info" aria-label="Service details" hidden></aside>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button id="dlg-close" type="button">Close</button>
  </div>
  <div class="tabs" role="group" aria-label="Time range" id="tabs"></div>
  <div id="dlg-chart" class="chart" role="img"></div>
  <div id="dlg-stats" class="stats"></div>
</dialog>

<!-- ===== ADMIN ===== -->
<div id="vAdmin" class="wrap wide" hidden>
  <header class="bar">
    <div class="brand">
      <img class="logo-light" src="/logo.png" alt="Merdeka Telekomunikasi Center" height="30">
      <img class="logo-dark" src="/logo-dark.png" alt="" aria-hidden="true" height="30">
      <h1>Manage Customers</h1>
    </div>
    <div class="bar-actions">
      <div class="profile">
        <button type="button" class="profile-btn" id="aprof" aria-haspopup="menu" aria-expanded="false" aria-controls="amenu" aria-label="Account menu">
          <span class="avatar" id="aav" aria-hidden="true">?</span><span class="pname" id="apname"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="amenu" role="menu" hidden>
          <div class="menu-head"><strong id="aname"></strong><small id="awho"></small></div>
          <button type="button" role="menuitem" data-pass>Change password</button>
          <button type="button" role="menuitem" class="danger" id="alogout">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <p id="status" class="note" role="status"></p>

  <div class="admin">
    <aside>
      <input id="aq" class="search" type="search" placeholder="Search name or username" aria-label="Search customers">
      <button id="add" class="primary" type="button">Add customer</button>
      <ul id="list" class="list"></ul>
    </aside>
    <section id="detail" class="panel"></section>
  </div>
</div>

<dialog id="dPass">
  <form id="fChangePass" class="stack">
    <h2>Change password</h2>
    <label>Current password<input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password (min. 8 characters)<input name="next" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
    <label>Confirm new password<input name="confirm" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
    <p id="passMsg" class="error" role="alert"></p>
    <div class="row-btns">
      <button class="primary" type="submit">Update password</button>
      <button type="button" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="dAdd">
  <form id="fAdd" class="stack">
    <h2>New customer</h2>
    <label>Name<input name="name" required maxlength="100"></label>
    <label>Username<input name="username" required autocapitalize="none" spellcheck="false" autocomplete="off"></label>
    <label>Password (min. 8 characters)<input name="password" type="text" required minlength="8" autocomplete="off"></label>
    <p id="addErr" class="error" role="alert"></p>
    <div class="row-btns">
      <button class="primary" type="submit">Create customer</button>
      <button type="button" data-close>Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="dPort">
  <div class="stack">
    <h2>Find a port in LibreNMS</h2>
    <input id="pq" class="search" type="search" placeholder="Device name, interface, or description" aria-label="Search ports">

</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- state ----------
let customers = [], sel = null, services = [], editing = null; // admin
let dsvc = [];                                                  // dashboard

// ---------- tampilan (login / dash / admin) ----------
const views = { login: $("#vLogin"), dash: $("#vDash"), admin: $("#vAdmin") };
const titles = { login: "Sign in - Customer Portal", dash: "My Service Traffic", admin: "Admin - Customer Portal" };

function show(v) {
  document.querySelectorAll("dialog[open]").forEach((d) => d.close());
  for (const k in views) views[k].hidden = k !== v;
  document.querySelectorAll(".profile").forEach((p) => p._close && p._close());
  document.title = titles[v];
  if (v === "login") $("#username").focus();
}
function reset() {
  customers = []; sel = null; services = []; editing = null; dsvc = []; trafficCache.clear();
  $("#detail").innerHTML = ""; $("#list").innerHTML = ""; $("#aq").value = ""; $("#status").textContent = "";
  $("#app").innerHTML = ""; $("#dq").value = ""; $("#dq").hidden = true; $("#toolbar").hidden = true;
}
async function logout() {
  try { await fetch("/api/logout", { method: "POST" }); } catch {}
  reset(); show("login");
}
$("#dlogout").addEventListener("click", logout);
$("#alogout").addEventListener("click", logout);

const enter = (admin) => (admin ? enterAdmin() : enterDash());

// ---------- login ----------
const lf = $("#f"), lmsg = $("#msg");
lf.addEventListener("submit", async (e) => {
  e.preventDefault();
  lmsg.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: lf.username.value, password: lf.password.value }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) { lf.password.value = ""; enter(!!data.admin); }
    else lmsg.textContent = data.error || "Sign-in failed. Please try again.";
  } catch {
    lmsg.textContent = "Cannot connect to the server.";
  }
});

// ================= DASHBOARD PELANGGAN =================
const PERIODS = { day: "Daily", week: "Weekly", month: "Monthly", year: "Yearly" };
const app = $("#app"), dq = $("#dq"), dlg = $("#dlg");

// Kolom info layanan: [nama kolom, label tampilan, contoh isian]
const SVC_FIELDS = [
  ["service_type", "Service type", "Dedicated Internet"],
  ["pks_no", "PKS No", "012/MTC/2025"],
  ["vlan", "VLAN", "837"],
  ["ip_ptp", "IP PTP", "10.20.30.2/30"],
  ["location", "Location", "Semarang"],
];
function renderInfo(list) {
  const box = $("#info");
  const withInfo = list.filter((s) => SVC_FIELDS.some(([k]) => (s[k] || "").trim()));
  $("#dlayout").classList.toggle("no-info", !withInfo.length);
  box.hidden = !withInfo.length;
  if (!withInfo.length) return;
  const rows = (s) => SVC_FIELDS.filter(([k]) => (s[k] || "").trim())
    .map(([k, name]) => `<dt>${name}</dt><dd>${esc(s[k])}</dd>`).join("");
  if (withInfo.length === 1) { box.innerHTML = `<h2>Service details</h2><dl>${rows(withInfo[0])}</dl>`; return; }
  const open = withInfo.length <= 3 ? " open" : "";
  box.innerHTML = "<h2>Service details</h2>" + withInfo.map((s) =>
    `<details${open}><summary>${esc(s.label)}</summary><dl>${rows(s)}</dl></details>`).join("");
}

function renderCards(list) {
  renderInfo(list);
  if (!list.length) { app.className = "empty"; app.textContent = "No services match your search."; return; }
  app.className = "grid";
  app.innerHTML = list.map((s) => `
    <button type="button" class="card" data-id="${s.id}">
      <h2>${esc(s.label)}</h2>
      <div class="chart" data-chart="${s.id}" role="img" aria-label="Traffic graph for ${esc(s.label)}"></div>
    </button>`).join("");
  app.querySelectorAll("[data-chart]").forEach((el) => io.observe(el));
}

// ---------- grafik (digambar sendiri, in dan out sama-sama di atas sumbu) ----------
const UP = "#22a559", DOWN = "#3b7ddd";
let gperiod = "day";
const trafficCache = new Map();
let seq = 0;

async function loadTraffic(id, period) {
  const k = id + ":" + period;
  const c = trafficCache.get(k);
  if (c && Date.now() - c.t < 5 * 60 * 1000) return c.d;
  const r = await fetch(`/api/traffic/${id}/${period}`);
  if (r.status === 401) { reset(); show("login"); throw new Error("auth"); }
  if (!r.ok) throw new Error("gagal");
  const d = await r.json();
  if (!Array.isArray(d.in) || !Array.isArray(d.out) || !d.in.length) throw new Error("kosong");
  trafficCache.set(k, { t: Date.now(), d });
  return d;
}

const fmtRate = (b) => {
  if (b == null) return "-";
  const u = ["bps", "Kbps", "Mbps", "Gbps", "Tbps"]; let i = 0;
  while (b >= 1000 && i < 4) { b /= 1000; i++; }
  return (i === 0 || b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + " " + u[i];
};
// langkah sumbu kelipatan bersih (1, 2, 2.5, 5 x 10^n), maksimal "maxTicks" garis
const niceScale = (peak, maxTicks) => {
  if (peak <= 0) return { step: 250, top: 1000 };
  const raw = peak / maxTicks, p = 10 ** Math.floor(Math.log10(raw));
  const step = ([1, 2, 2.5, 5, 10].find((s) => s * p >= raw) || 10) * p;
  return { step, top: Math.ceil(peak / step - 1e-9) * step };
};
const fmtT = (t, p) => new Date(t * 1000).toLocaleString("en-GB",
  p === "day" ? { hour: "2-digit", minute: "2-digit" }
  : p === "week" ? { weekday: "short" }
  : p === "month" ? { day: "numeric", month: "short" } : { month: "short" });

function stat(arr) {
  const v = arr.filter((x) => x != null);
  if (!v.length) return null;
  return { max: Math.max(...v), avg: v.reduce((a, b) => a + b, 0) / v.length, last: v[v.length - 1] };
}
function statsHtml(d) {
  const row = (name, color, s) => `<tr><td><span class="dot" style="background:${color}"></span>${name}</td>
    <td>${s ? fmtRate(s.max) : "-"}</td><td>${s ? fmtRate(s.avg) : "-"}</td><td>${s ? fmtRate(s.last) : "-"}</td></tr>`;
  return `<div class="scroll"><table><thead><tr><th></th><th>Maximum</th><th>Average</th><th>Latest</th></tr></thead><tbody>
    ${row("In", UP, stat(d.in))}${row("Out", DOWN, stat(d.out))}</tbody></table></div>`;
}

function paint(host) {
  const { d, period, small } = host._d || {};
  const W = host.clientWidth;
  if (!d || !W) return;
  const H = small ? (W > 600 ? 240 : 170) : 260;
  host.innerHTML = "";
  const cv = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  host.appendChild(cv);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const muted = cs.getPropertyValue("--muted").trim(), line = cs.getPropertyValue("--line").trim();
  const R = 10, T = 10, B = 24, ph = H - T - B, n = d.in.length;
  const { step, top } = niceScale(Math.max(0, ...d.in.map((v) => v || 0), ...d.out.map((v) => v || 0)), small ? 4 : 5);
  const lines = Math.round(top / step);
  g.font = "11px system-ui, sans-serif";
  // lebar area label sumbu Y diukur dari teksnya, supaya tidak terpotong di font mana pun
  let L = 0;
  for (let k = 0; k <= lines; k++) L = Math.max(L, g.measureText(fmtRate(step * k)).width);
  L = Math.ceil(L) + 14;
  const pw = W - L - R;
  const X = (i) => L + (n > 1 ? (i * pw) / (n - 1) : 0);
  const Y = (v) => T + ph - (v / top) * ph;

  g.font = "11px system-ui, sans-serif"; g.lineWidth = 1;
  g.textBaseline = "middle"; g.textAlign = "right";
  for (let k = 0; k <= lines; k++) {
    const y = Y(step * k);
    g.strokeStyle = line; g.beginPath(); g.moveTo(L, y + .5); g.lineTo(W - R, y + .5); g.stroke();
    g.fillStyle = muted; g.fillText(fmtRate(step * k), L - 6, y);
  }
  g.textBaseline = "top"; g.fillStyle = muted;
  const ticks = small ? 3 : 6;
  for (let k = 0; k <= ticks; k++) {
    const i = Math.round((k * (n - 1)) / ticks);
    g.textAlign = k === 0 ? "left" : k === ticks ? "right" : "center";
    g.fillText(fmtT(d.start + i * d.step, period), X(i), T + ph + 7);
  }

  const segs = (arr) => {
    const s = []; let a = -1;
    for (let i = 0; i <= n; i++) {
      const ok = i < n && arr[i] != null;
      if (ok && a < 0) a = i;
      if (!ok && a >= 0) { s.push([a, i - 1]); a = -1; }
    }
    return s;
  };
  const path = (arr, a, b) => { g.beginPath(); for (let i = a; i <= b; i++) i === a ? g.moveTo(X(i), Y(arr[i])) : g.lineTo(X(i), Y(arr[i])); };
  g.lineJoin = "round";
  for (const [a, b] of segs(d.in)) {            // In: area hijau
    path(d.in, a, b); g.lineTo(X(b), Y(0)); g.lineTo(X(a), Y(0)); g.closePath();
    g.fillStyle = UP + "66"; g.fill();
    path(d.in, a, b); g.strokeStyle = UP; g.lineWidth = 1.25; g.stroke();
  }
  for (const [a, b] of segs(d.out)) {           // Out: garis biru
    path(d.out, a, b); g.strokeStyle = DOWN; g.lineWidth = 1.6; g.stroke();
  }

  if (small) return;
  const cur = document.createElement("div"); cur.className = "cursor"; cur.hidden = true;
  cur.style.top = T + "px"; cur.style.height = ph + "px";
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
  host.append(cur, tip);
  cv.addEventListener("pointermove", (e) => {
    const x = e.clientX - cv.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(n - 1, Math.round(((x - L) / pw) * (n - 1))));
    cur.hidden = tip.hidden = false; cur.style.left = X(i) + "px";
    tip.innerHTML = `${new Date((d.start + i * d.step) * 1000).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}<br>
      <span class="dot" style="background:${UP}"></span>In ${fmtRate(d.in[i])}<br>
      <span class="dot" style="background:${DOWN}"></span>Out ${fmtRate(d.out[i])}`;
    tip.style.left = Math.max(0, Math.min(W - tip.offsetWidth, X(i) + 12)) + "px";
  });
  cv.addEventListener("pointerleave", () => { cur.hidden = tip.hidden = true; });
}

async function showChart(host, id, period, small) {
  const stamp = String(++seq);
  host.dataset.seq = stamp; host._d = null;
  host.innerHTML = '<p class="empty">Loading...</p>';
  try {
    const d = await loadTraffic(id, period);
    if (host.dataset.seq !== stamp) return;
    host._d = { d, period, small }; paint(host);
    if (!small) $("#dlg-stats").innerHTML = statsHtml(d);
  } catch (e) {
    if (e.message === "auth" || host.dataset.seq !== stamp) return;
    // cadangan: gambar PNG bawaan LibreNMS bila data JSON belum tersedia
    host.innerHTML = `<img src="/graph/${id}/${period}.png${small ? "?s=sm" : ""}" alt="">`;
  }
}

function renderPeriodTabs() {
  $("#ptabs").innerHTML = Object.entries(PERIODS).map(([p, n]) =>
    `<button type="button" data-p="${p}" aria-pressed="${p === gperiod}">${n}</button>`).join("");
}
$("#ptabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (!b || b.dataset.p === gperiod) return;
  gperiod = b.dataset.p; renderPeriodTabs();
  app.querySelectorAll("[data-chart][data-loaded]").forEach((el) => showChart(el, el.dataset.chart, gperiod, true));
});

// kartu dimuat saat terlihat saja
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return;
  io.unobserve(e.target);
  e.target.dataset.loaded = "1";
  showChart(e.target, e.target.dataset.chart, gperiod, true);
}), { rootMargin: "200px" });

let rt;
const repaintAll = () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll(".chart").forEach((h) => h._d && paint(h)), 120); };
window.addEventListener("resize", repaintAll);
new MutationObserver(repaintAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaintAll);

function openDetail(svc, period) {
  $("#dlg-title").textContent = svc.label;
  $("#tabs").innerHTML = Object.entries(PERIODS).map(([p, name]) =>
    `<button type="button" data-p="${p}" aria-pressed="${p === period}">${name}</button>`).join("");
  const host = $("#dlg-chart");
  host.setAttribute("aria-label", `Traffic graph for ${svc.label}, ${PERIODS[period].toLowerCase()}`);
  $("#dlg-stats").innerHTML = "";
  dlg.dataset.id = svc.id;
  if (!dlg.open) dlg.showModal();
  showChart(host, svc.id, period, false);
}

async function enterDash() {
  show("dash");
  app.className = "empty"; app.textContent = "Loading...";
  try {
    const [me, svc] = await Promise.all([fetch("/api/me"), fetch("/api/services")]);
    if (me.status === 401 || svc.status === 401) { show("login"); return; }
    const user = await me.json();
    setProfile("d", user);
    dsvc = await svc.json();
    if (!dsvc.length) {
      app.textContent = "No services are linked to your account yet. Please contact us to get activated.";
      return;
    }
    $("#toolbar").hidden = false; renderPeriodTabs();
    if (dsvc.length > 4) dq.hidden = false;
    renderCards(dsvc);
  } catch { app.className = "error"; app.textContent = "Failed to load data."; }
}

dq.addEventListener("input", () => {
  const t = dq.value.trim().toLowerCase();
  renderCards(dsvc.filter((s) => s.label.toLowerCase().includes(t)));
});
app.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  openDetail(dsvc.find((s) => String(s.id) === card.dataset.id), gperiod);
});
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (b) openDetail(dsvc.find((s) => String(s.id) === dlg.dataset.id), b.dataset.p);
});
$("#dlg-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

// Gambar gagal dimuat: tampilkan pesan, bukan ikon rusak
document.addEventListener("error", (e) => {
  if (e.target.tagName !== "IMG") return;
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = "The graph could not be loaded. Please try again in a few minutes.";
  e.target.replaceWith(p);
}, true);

// ---------- menu profil ----------
function setProfile(p, user) {
  const name = String(user.name || user.username || "?");
  const ini = name.trim().split(/\s+/).slice(0, 2).map((w) => Array.from(w)[0]).join("").toUpperCase();
  $("#" + p + "av").textContent = ini || "?";
  $("#" + p + "pname").textContent = name;
  $("#" + p + "name").textContent = name;
  $("#" + p + "who").textContent = user.username;
}
document.querySelectorAll(".profile").forEach((box) => {
  const btn = $(".profile-btn", box), menu = $(".menu", box);
  const items = () => [...menu.querySelectorAll("[role=menuitem]")];
  const close = (focus) => {
    menu.hidden = true; btn.setAttribute("aria-expanded", "false");
    if (focus) btn.focus();
  };
  box._close = close;
  btn.addEventListener("click", () => {
    const open = menu.hidden;
    document.querySelectorAll(".profile").forEach((o) => o !== box && o._close());
    menu.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) items()[0].focus();
  });
  menu.addEventListener("click", () => close());
  menu.addEventListener("keydown", (e) => {
    const list = items(), i = list.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); close(true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
  });
});
document.addEventListener("click", (e) => {
  document.querySelectorAll(".profile").forEach((box) => { if (!box.contains(e.target)) box._close(); });
});

// ---------- ganti password sendiri (pelanggan dan admin) ----------
const pm = $("#passMsg");
document.querySelectorAll("[data-pass]").forEach((b) => b.addEventListener("click", () => {
  $("#fChangePass").reset(); pm.textContent = ""; pm.className = "error"; $("#dPass").showModal();
}));
$("#fChangePass").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  pm.className = "error";
  if (f.next.value !== f.confirm.value) { pm.textContent = "The new passwords do not match."; return; }
  try {
    const r = await fetch("/api/me/password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current: f.current.value, next: f.next.value }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { $("#dPass").close(); reset(); show("login"); return; }
    if (!r.ok) { pm.textContent = data.error || "Could not change the password."; return; }
    f.reset(); pm.className = "note"; pm.textContent = "Password changed.";
    setTimeout(() => $("#dPass").close(), 1200);
  } catch { pm.textContent = "Cannot connect to the server."; }
});

// ================= ADMIN =================
async function api(url, method = "GET", body) {
  const r = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 || r.status === 403) { reset(); show("login"); throw new Error("auth"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Something went wrong");
  return data;
}
function say(msg, bad) { const s = $("#status"); s.textContent = msg; s.className = bad ? "error" : "note"; }
const run = (fn) => fn().catch((e) => { if (e.message !== "auth") say(e.message, true); });

async function enterAdmin() {
  show("admin");
  await run(async () => {
    const me = await api("/api/me");
    setProfile("a", me);
    await loadCustomers(); renderDetail();
  });
}

// ---------- daftar pelanggan ----------
function renderList() {
  const t = $("#aq").value.trim().toLowerCase();
  const rows = customers.filter((c) => `${c.name} ${c.username}`.toLowerCase().includes(t));
  $("#list").innerHTML = rows.length
    ? rows.map((c) => `<li><button type="button" class="item" data-id="${c.id}" aria-pressed="${c.id === sel}">
        <strong>${esc(c.name)}</strong>
        <span>${esc(c.username)}, ${c.services} ${c.services === 1 ? "service" : "services"}${c.active ? "" : ", inactive"}</span></button></li>`).join("")
    : `<li class="empty">${customers.length ? "No matches." : "No customers yet."}</li>`;
}
async function loadCustomers() { customers = await api("/api/admin/customers"); renderList(); }

async function select(id) {
  sel = id; editing = null;
  services = await api(`/api/admin/customers/${id}/services`);
  renderList(); renderDetail();
}

// ---------- detail pelanggan ----------
function renderDetail() {
  const c = customers.find((x) => x.id === sel);
  const box = $("#detail");
  if (!c) { box.innerHTML = '<p class="empty">Select a customer from the list, or add a new one.</p>'; return; }
  const e = editing ? services.find((s) => s.id === editing) : null;
  box.innerHTML = `
    <h2>${esc(c.name)}</h2>
    <p class="note">Username: ${esc(c.username)}</p>

    <form id="fCust" class="inline">
      <label>Name<input name="name" value="${esc(c.name)}" required maxlength="100"></label>
      <label class="check"><input name="active" type="checkbox" ${c.active ? "checked" : ""}> Account active</label>
      <button type="submit">Save</button>
    </form>

    <form id="fPass" class="inline">
      <label>New password<input name="password" type="text" minlength="8" required autocomplete="off" placeholder="at least 8 characters"></label>
      <button type="submit">Change password</button>
    </form>

    <h3>Services</h3>
    ${services.length ? `<div class="scroll"><table>
      <thead><tr><th>Label</th><th>Port ID</th><th></th></tr></thead>
      <tbody>${services.map((s) => `<tr>
        <td>${esc(s.label)}</td><td>${s.lnms_port_id}</td>
        <td class="act"><button type="button" data-edit="${s.id}">Edit</button>
            <button type="button" class="danger" data-delsvc="${s.id}">Delete</button></td></tr>`).join("")}
      </tbody></table></div>` : '<p class="empty">No services yet.</p>'}

    <form id="fSvc" class="inline">
      <label>Label (card title)<input name="label" value="${e ? esc(e.label) : ""}" required maxlength="120"></label>
      <label>LibreNMS Port ID<input name="port" value="${e ? e.lnms_port_id : ""}" required inputmode="numeric" pattern="[0-9]+"></label>
      ${SVC_FIELDS.map(([k, name, ex]) => `<label>${name}<input name="${k}" value="${e ? esc(e[k] || "") : ""}" maxlength="100" placeholder="e.g. ${ex}"></label>`).join("")}
      <button type="button" id="findPort">Find port</button>
      <button class="primary" type="submit">${e ? "Save changes" : "Add service"}</button>
      ${e ? '<button type="button" id="cancelEdit">Cancel</button>' : ""}
    </form>

    <p><button type="button" class="danger" id="delCust">Delete this customer</button></p>`;
}

$("#detail").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target;
  run(async () => {
    if (f.id === "fCust") {
      await api(`/api/admin/customers/${sel}`, "PATCH", { name: f.name.value, active: f.active.checked });
      await loadCustomers(); renderDetail(); say("Changes saved.");
    } else if (f.id === "fPass") {
      await api(`/api/admin/customers/${sel}`, "PATCH", { password: f.password.value });
      f.reset(); say("Password changed.");
    } else if (f.id === "fSvc") {
      const body = { label: f.label.value, lnms_port_id: f.port.value };
      for (const [k] of SVC_FIELDS) body[k] = f.elements[k].value;
      if (editing) await api(`/api/admin/services/${editing}`, "PATCH", body);
      else await api(`/api/admin/customers/${sel}/services`, "POST", body);
      editing = null; say("Service saved.");
      await loadCustomers(); await select(sel);
    }
  });
});

$("#detail").addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.dataset.edit) { editing = Number(t.dataset.edit); renderDetail(); $("#fSvc input").focus(); }
  else if (t.id === "cancelEdit") { editing = null; renderDetail(); }
  else if (t.id === "findPort") { $("#perr").textContent = ""; $("#dPort").showModal(); $("#pq").focus(); searchPorts(); }
  else if (t.dataset.delsvc) run(async () => {
    if (!confirm("Delete this service?")) return;
    await api(`/api/admin/services/${t.dataset.delsvc}`, "DELETE");
    await loadCustomers(); await select(sel); say("Service deleted.");
  });
  else if (t.id === "delCust") run(async () => {
    const c = customers.find((x) => x.id === sel);
    if (!confirm(`Delete customer "${c.name}" and all of their services?`)) return;
    await api(`/api/admin/customers/${sel}`, "DELETE");
    sel = null; await loadCustomers(); renderDetail(); say("Customer deleted.");
  });
});

$("#list").addEventListener("click", (ev) => {
  const b = ev.target.closest(".item");
  if (b) run(() => select(Number(b.dataset.id)));
});
$("#aq").addEventListener("input", renderList);

// ---------- tambah pelanggan ----------
$("#add").addEventListener("click", () => { $("#fAdd").reset(); $("#addErr").textContent = ""; $("#dAdd").showModal(); });
$("#fAdd").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  try {
    const r = await api("/api/admin/customers", "POST",
      { name: f.name.value, username: f.username.value, password: f.password.value });
    $("#dAdd").close();
    await loadCustomers(); await select(r.id); say("Customer created. Now add their services.");
  } catch (e) { if (e.message !== "auth") $("#addErr").textContent = e.message; }
});

// ---------- cari port ----------
let timer;
async function searchPorts() {
  const out = $("#pres");
  try {
    const rows = await api(`/api/admin/ports?q=${encodeURIComponent($("#pq").value)}`);
    $("#perr").textContent = "";
    out.innerHTML = rows.length
      ? rows.map((p) => `<li><button type="button" class="item" data-pid="${p.port_id}" data-alias="${esc(p.ifAlias)}">
          <strong>${esc(p.device)}: ${esc(p.ifName)}</strong>
          <span>ID ${p.port_id}${p.ifAlias ? ", " + esc(p.ifAlias) : ""}</span></button></li>`).join("")
      : '<li class="empty">No ports found.</li>';
  } catch (e) { if (e.message !== "auth") { out.innerHTML = ""; $("#perr").textContent = e.message; } }
}
$("#pq").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(searchPorts, 250); });
$("#pres").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-pid]");
  if (!b) return;
  const f = $("#fSvc");
  f.port.value = b.dataset.pid;
  if (!f.label.value && b.dataset.alias) f.label.value = b.dataset.alias;
  $("#dPort").close(); f.label.focus();
});
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));

// ================= MULAI =================
// Cek sesi: belum login -> halaman login; admin -> admin; pelanggan -> dashboard.
(async function boot() {
  try {
    const r = await fetch("/api/me");
    if (!r.ok) { show("login"); return; }
    const me = await r.json();
    let admin = me.admin;
    if (typeof admin !== "boolean") admin = (await fetch("/api/admin/customers")).ok;
    enter(admin);
  } catch {
    show("login");
    lmsg.textContent = "Cannot connect to the server.";
  }
})();
</script>
